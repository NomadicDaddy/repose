[package]
name = "repose"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "repose: a fast desktop viewer for many Git repositories"

[[bin]]
name = "repose"
path = "src/main.rs"

[dependencies]
repose-core = { workspace = true }
eframe = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
