[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "1.4.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
repose-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
toml = "1"
# Rewrites one key of config.toml in place, keeping every other key and comment (pin saves).
toml_edit = "0.25"
eframe = "0.37"
similar = "2"
# Syntax colouring: fancy-regex engines only, so no C dependency (resolved:
# docs/specs/2026-11-01-repose-v1/technical-spec.md, Open decisions item 3).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
# File-system events for live refresh (ReadDirectoryChangesW on Windows).
notify = "8.2"
# Build-only: compiles assets/icon/repose.ico into the Windows executable (program-icon).
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
