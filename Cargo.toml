[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
repose-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
toml = "1"
eframe = "0.37"
similar = "2"
# Syntax colouring: fancy-regex engines only, so no C dependency (ADR open decision 3).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
# File-system events for live refresh (ReadDirectoryChangesW on Windows).
notify = "8.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
