[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
repose-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
toml = "1"
eframe = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
